
plugins {
    id 'com.android.application'
}

def googleWebClientId = System.getenv("GOOGLE_WEB_CLIENT_ID") ?: ""

android {
    namespace 'com.kp.upscprofessional'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kp.upscprofessional'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID",
                "\"${googleWebClientId}\""
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
